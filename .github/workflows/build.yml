name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -q Special_Intelligence_Android.zip -d src
          PROJ=$(dirname "$(find src -name settings.gradle | head -1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Fix JVM target (Java 17)
        run: |
          cd "$PROJ"
          python3 - <<'PY'
          p = "app/build.gradle"
          s = open(p).read()
          if "VERSION_17" not in s:
              add = ("\n    compileOptions {\n"
                     "        sourceCompatibility JavaVersion.VERSION_17\n"
                     "        targetCompatibility JavaVersion.VERSION_17\n"
                     "    }\n"
                     "    kotlinOptions {\n"
                     "        jvmTarget = '17'\n"
                     "    }\n")
              s = s.replace("compileSdk 35\n", "compileSdk 35\n" + add, 1)
              open(p, "w").write(s)
          PY
          cat app/build.gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: Special-Intelligence-APK
          path: out/app-debug.apk
